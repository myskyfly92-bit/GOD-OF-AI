<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENVIRONMENT - 현장 날씨·대기환경 모니터링</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.04em;
    }
    .label-text {
      color: #94A3B8; /* slate-400 */
      font-size: 13px;
      font-weight: 500;
      margin-top: 6px;
    }
    .metric-val {
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    @media (max-width: 640px) {
      .metric-val {
        font-size: 30px;
      }
      .label-text {
        font-size: 11px;
      }
    }
  </style>
</head>
<body class="bg-[#090D14] min-h-screen flex items-center justify-center p-4 selection:bg-purple-900 selection:text-white">

  <!-- Main Container -->
  <div class="relative w-full max-w-[620px] bg-[#101722] rounded-3xl p-7 sm:p-9 border border-[#1E293B] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)]">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 pb-1">
      <div class="flex items-center gap-2 font-mono-num text-[12px] sm:text-[13px] tracking-wider text-slate-400 font-semibold">
        <span class="text-slate-300">ENVIRONMENT</span>
        <span class="text-slate-600">·</span>
        <span class="text-slate-400">현장 날씨·대기환경</span>
      </div>
      <div id="status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/25 text-emerald-400 text-[11px] font-medium transition-all">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="status-text">실시간 연동</span>
      </div>
    </div>

    <!-- 3x4 Metrics Grid -->
    <div class="grid grid-cols-3 gap-y-8 gap-x-4 sm:gap-x-6">

      <!-- Row 1: 기온 / 체감온도 / 습도 -->
      <div class="flex flex-col">
        <div id="val-temp" class="metric-val text-[#FB7185]">40.0</div>
        <div class="label-text">기온 (℃)</div>
      </div>

      <div class="flex flex-col">
        <div id="val-apparent" class="metric-val text-[#FB7185]">40.1</div>
        <div class="label-text">체감온도 (℃)</div>
      </div>

      <div class="flex flex-col">
        <div id="val-humidity" class="metric-val text-[#38BDF8]">16</div>
        <div class="label-text">습도 (%)</div>
      </div>

      <!-- Row 2: 풍속 / 풍향 / 미세먼지 -->
      <div class="flex flex-col">
        <div id="val-windspeed" class="metric-val text-[#2DD4BF]">8.8</div>
        <div class="label-text">풍속 (m/s)</div>
      </div>

      <div class="flex flex-col">
        <div class="flex items-center gap-1.5 text-[28px] sm:text-[32px] font-bold leading-none tracking-tight text-[#34D399]">
          <svg id="val-windarrow" class="w-5 h-5 fill-current transform inline-block transition-transform duration-500" style="transform: rotate(279deg);" viewBox="0 0 24 24">
            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
          </svg>
          <span id="val-winddir">W (279°)</span>
        </div>
        <div class="label-text">풍향</div>
      </div>

      <div class="flex flex-col">
        <div id="val-pm10" class="metric-val text-[#FBBF24]">71</div>
        <div class="label-text">미세먼지 PM10 (µg/㎥)</div>
      </div>

      <!-- Row 3: 초미세먼지 / 자외선 지수 (차분한 보라색) / 오존 -->
      <div class="flex flex-col">
        <div id="val-pm25" class="metric-val text-[#FB923C]">30</div>
        <div class="label-text">초미세먼지 PM2.5 (µg/㎥)</div>
      </div>

      <!-- 자외선 지수: 차분한 바이올렛(#A78BFA) 및 소프트 라벤더 라벨(#C4B5FD) -->
      <div class="flex flex-col">
        <div class="flex items-baseline gap-1.5 leading-none">
          <span id="val-uv" class="metric-val text-[#A78BFA]">6.2</span>
          <span id="val-uv-label" class="text-base sm:text-lg font-semibold text-[#C4B5FD]">(높음)</span>
        </div>
        <div class="label-text">자외선 지수 (UV)</div>
      </div>

      <div class="flex flex-col">
        <div id="val-o3" class="metric-val text-[#2DD4BF]">111</div>
        <div class="label-text">오존 O₃ (µg/㎥)</div>
      </div>

      <!-- Row 4: 일출 / 일몰 / 강수확률 -->
      <div class="flex flex-col">
        <div id="val-sunrise" class="metric-val text-[#FDE68A]">05:50</div>
        <div class="label-text">일출</div>
      </div>

      <div class="flex flex-col">
        <div id="val-sunset" class="metric-val text-[#FDE68A]">17:57</div>
        <div class="label-text">일몰</div>
      </div>

      <div class="flex flex-col">
        <div id="val-pop" class="metric-val text-[#38BDF8]">0%</div>
        <div class="label-text">강수확률 (%)</div>
      </div>

    </div>

    <!-- Footer -->
    <div class="mt-9 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[11px] sm:text-[12px] text-slate-500 font-normal">
      <span>Open-Meteo 실시간 기상·대기질 API 연동 · 비스마야(33.19°N, 44.62°E) 기준</span>
      <span id="val-updated-time" class="text-slate-500 font-mono-num">동기화 완료</span>
    </div>

  </div>

  <!-- Open-Meteo Realtime Fetching Script -->
  <script>
    const LAT = 33.19;
    const LON = 44.62;
    const TIMEZONE = "Asia/Baghdad";

    function getWindDirection(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const index = Math.round(deg / 22.5) % 16;
      return dirs[index];
    }

    function getUVLevel(uv) {
      if (uv >= 11) return '(위험)';
      if (uv >= 8)  return '(매우높음)';
      if (uv >= 6)  return '(높음)';
      if (uv >= 3)  return '(보통)';
      return '(낮음)';
    }

    async function fetchEnvironmentData() {
      try {
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,wind_speed_10m,wind_direction_10m,uv_index&daily=sunrise,sunset&timezone=${encodeURIComponent(TIMEZONE)}`;
        const airUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm10,pm2_5,ozone&timezone=${encodeURIComponent(TIMEZONE)}`;

        const [weatherRes, airRes] = await Promise.all([
          fetch(weatherUrl),
          fetch(airUrl)
        ]);

        if (!weatherRes.ok || !airRes.ok) throw new Error("API 요청 실패");

        const weatherData = await weatherRes.json();
        const airData = await airRes.json();

        // 1. Weather Current
        const cur = weatherData.current;
        if (cur) {
          if (cur.temperature_2m !== undefined) document.getElementById('val-temp').innerText = Number(cur.temperature_2m).toFixed(1);
          if (cur.apparent_temperature !== undefined) document.getElementById('val-apparent').innerText = Number(cur.apparent_temperature).toFixed(1);
          if (cur.relative_humidity_2m !== undefined) document.getElementById('val-humidity').innerText = Math.round(cur.relative_humidity_2m);
          if (cur.wind_speed_10m !== undefined) {
            // km/h to m/s
            const ms = (cur.wind_speed_10m / 3.6).toFixed(1);
            document.getElementById('val-windspeed').innerText = ms;
          }
          if (cur.wind_direction_10m !== undefined) {
            const deg = Math.round(cur.wind_direction_10m);
            const dir = getWindDirection(deg);
            document.getElementById('val-winddir').innerText = `${dir} (${deg}°)`;
            document.getElementById('val-windarrow').style.transform = `rotate(${deg}deg)`;
          }
          if (cur.precipitation_probability !== undefined) {
            document.getElementById('val-pop').innerText = `${Math.round(cur.precipitation_probability)}%`;
          }
          if (cur.uv_index !== undefined) {
            const uv = Number(cur.uv_index).toFixed(1);
            document.getElementById('val-uv').innerText = uv;
            document.getElementById('val-uv-label').innerText = getUVLevel(Number(uv));
          }
        }

        // 2. Air Quality Current
        const air = airData.current;
        if (air) {
          if (air.pm10 !== undefined) document.getElementById('val-pm10').innerText = Math.round(air.pm10);
          if (air.pm2_5 !== undefined) document.getElementById('val-pm25').innerText = Math.round(air.pm2_5);
          if (air.ozone !== undefined) document.getElementById('val-o3').innerText = Math.round(air.ozone);
        }

        // 3. Daily Sunrise / Sunset
        if (weatherData.daily && weatherData.daily.sunrise && weatherData.daily.sunset) {
          const sunrise = weatherData.daily.sunrise[0]?.split('T')[1]?.substring(0, 5);
          const sunset = weatherData.daily.sunset[0]?.split('T')[1]?.substring(0, 5);
          if (sunrise) document.getElementById('val-sunrise').innerText = sunrise;
          if (sunset) document.getElementById('val-sunset').innerText = sunset;
        }

        const now = new Date();
        const timeStr = now.toTimeString().substring(0, 5);
        document.getElementById('val-updated-time').innerText = `최근 갱신: ${timeStr}`;
        document.getElementById('status-text').innerText = '정상 연동';
      } catch (err) {
        console.warn("실시간 연동 대기 (기본값 표시):", err);
        document.getElementById('status-text').innerText = '기준 데이터';
      }
    }

    // 초기 실행 및 10분 주기 자동 동기화
    fetchEnvironmentData();
    setInterval(fetchEnvironmentData, 600000);
  </script>
</body>
</html>
