name: Update KOSHA 중대재해 사이렌 (안전 › 사고사례)

on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch-kosha-siren.js
      - .github/workflows/update-kosha-siren.yml

permissions:
  contents: write

concurrency:
  group: kosha-siren
  cancel-in-progress: false

jobs:
  update-kosha-siren:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: playwright-core·sharp 설치 (러너에 깔린 Chrome 사용, 포스터 webp 변환)
        run: npm install --no-save --no-package-lock playwright-core@1.47.2 sharp@0.33.5

      - name: 중대재해 사이렌 수집
        run: node scripts/fetch-kosha-siren.js

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kosha-siren.json assets/siren 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 중대재해 사이렌 자동 갱신"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          exit 1
