name: Update Overseas Projects (DART)

on:
  schedule:
    # 매일 한국시간 07:23 (공시는 주로 낮에 올라오므로 하루 한 번이면 충분)
    - cron: "23 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-overseas:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 무슨 일이 있어도 25분 넘게 돌지 않게
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: DART 해외 수주 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: "1"   # 진행 상황이 로그에 바로바로 보이게
        run: python scripts/fetch_dart_overseas.py

      - name: DART 정기보고서 진행률(공정률) 수집
        continue-on-error: true   # 실패해도 해외 현장 업데이트는 그대로 올린다
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_dart_progress.py

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overseas-projects.json dart-contracts-cache.json
          [ -f dart-progress.json ] && git add dart-progress.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 해외 현장(DART 공시) 자동 업데이트"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
