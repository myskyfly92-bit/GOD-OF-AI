name: Update Iraq market FX rate (시장환율)

on:
  schedule:
    # 1시간마다 (붐비는 정각을 피해 매시 12분). 깃허브 사정으로 늦어질 수 있음
    - cron: "12 * * * *"
  workflow_dispatch: {} # 저장소의 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update-market-fx:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Puppeteer(헤드리스 크롬) 설치
        run: npm install --no-save puppeteer@22

      - name: 시장환율 가져오기
        run: node scripts/fetch-market-fx.js

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 처음 만들어진 파일(아직 Git에 없는 파일)도 잡히도록 먼저 add 한 뒤 비교한다
          git add market-fx.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 이라크 시장환율 자동 갱신"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
