name: Update KDCA infectious disease stats (질병관리청 감염병 주별 현황)

on:
  schedule:
    # 매일 한국시간 07:47 (주별 통계지만 신고가 늦게 쌓이므로 매일 다시 받는다)
    - cron: "47 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-kdca-infectious:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 감염병 주별 현황 수집
        env:
          # 질병관리청 API를 활용신청한 공공데이터포털 계정의 인증키 (없으면 MOFA_API_KEY로 시도)
          KDCA_API_KEY: ${{ secrets.KDCA_API_KEY }}
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_kdca_infectious.py

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kdca-infectious.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 질병관리청 감염병 주별 현황 자동 업데이트"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
