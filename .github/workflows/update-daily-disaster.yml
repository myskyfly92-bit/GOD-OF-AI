name: Update Daily Construction Disaster Stats

on:
  schedule:
    - cron: "30 12 * * *"   # 매일 UTC 12:30 = 한국시간 21:30 (당일 신고 마감 이후)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-daily-disaster:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 전국 건설업 중대재해 수집 실행
        env:
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
        run: python scripts/fetch_daily_disaster.py

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-disaster.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 전국 건설업 중대재해 현황 자동 업데이트"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
