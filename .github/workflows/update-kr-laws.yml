name: Update KR safety laws (산업안전보건법령)

on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 한국시간 06:17 (법령은 자주 바뀌지 않아 주 1회)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-kr-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 산업안전보건법령 수집
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_kr_laws.py

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr-laws.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 산업안전보건법령 조문 자동 업데이트"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          exit 1
