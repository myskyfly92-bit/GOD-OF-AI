name: Update World AQI Ranking

on:
  schedule:
    - cron: "15 */3 * * *"   # 3시간마다
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-aqi-rank:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 세계 대기질 순위 수집
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_aqi_rank.py

      - name: 변경사항 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 세계 대기질 순위 자동 업데이트"
          file_pattern: aqi-rank.json
