name: Update domestic news (의학·질병·사고)

on:
  schedule:
    # 매일 UTC 21:00 (한국시간 오전 6시)에 실행
    - cron: "0 21 * * *"
  workflow_dispatch: {} # 저장소의 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update-domestic-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 뉴스 가져오기
        run: node scripts/fetch-domestic-news.js

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- domestic-news.json; then
            echo "변경사항 없음"
          else
            git add domestic-news.json
            git commit -m "chore: 국내 뉴스(의학·질병·사고) 자동 갱신"
            git push
          fi
