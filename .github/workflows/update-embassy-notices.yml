name: Update Embassy Safety Notices

on:
  schedule:
    - cron: "30 3 * * *"   # 매일 UTC 03:30 = 바그다드 06:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-embassy-notices:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 대사관 공지 수집 실행
        env:
          # 공공데이터포털 계정이 여러 개여도 되도록, 등록된 키를 모두 넘겨 API마다 되는 키를 골라 쓴다
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
          NOTICE_API_KEY: ${{ secrets.NOTICE_API_KEY }}
          TRAVEL_API_KEY: ${{ secrets.TRAVEL_API_KEY }}
          KDCA_API_KEY: ${{ secrets.KDCA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_embassy_notices.py

      - name: 변경사항 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 중동 각국 대사관 공지 자동 업데이트"
          file_pattern: embassy-notices.json
