name: Update drug database (식약처 의약품 검색 데이터)

on:
  schedule:
    - cron: "37 19 * * 0"   # 매주 월요일 한국시간 04:37
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-drug-db:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 의약품 허가정보 · e약은요 · 낱알식별 수집
        env:
          # 식약처 API를 활용신청한 공공데이터포털 계정의 인증키 (없으면 KDCA → MOFA 키로 시도)
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          KDCA_API_KEY: ${{ secrets.KDCA_API_KEY }}
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_drug_db.py

      - name: 변경사항 커밋 및 푸시 (충돌 시 자동 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug-db
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 식약처 의약품 검색 데이터 자동 갱신"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공"
              exit 0
            fi
            echo "충돌 발생, ${i}번째 재시도 전 5초 대기..."
            sleep 5
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
